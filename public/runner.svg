<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="20" r="10" fill="#002D54"/>
  <!-- Body -->
  <line x1="50" y1="30" x2="50" y2="60" stroke="#002D54" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Left Arm -->
  <line x1="50" y1="40" x2="30" y2="50" stroke="#002D54" stroke-width="6" stroke-linecap="round">
    <animate attributeName="x2" values="30; 70; 30" dur="0.8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="50; 35; 50" dur="0.8s" repeatCount="indefinite" />
  </line>
  
  <!-- Right Arm -->
  <line x1="50" y1="40" x2="70" y2="50" stroke="#002D54" stroke-width="6" stroke-linecap="round">
    <animate attributeName="x2" values="70; 30; 70" dur="0.8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="35; 50; 35" dur="0.8s" repeatCount="indefinite" />
  </line>
  
  <!-- Left Leg -->
  <line x1="50" y1="60" x2="35" y2="90" stroke="#00A3A6" stroke-width="6" stroke-linecap="round">
    <animate attributeName="x2" values="35; 65; 35" dur="0.8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="90; 80; 90" dur="0.8s" repeatCount="indefinite" />
  </line>
  
  <!-- Right Leg -->
  <line x1="50" y1="60" x2="65" y2="90" stroke="#00A3A6" stroke-width="6" stroke-linecap="round">
    <animate attributeName="x2" values="65; 35; 65" dur="0.8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="80; 90; 80" dur="0.8s" repeatCount="indefinite" />
  </line>
</svg>
